name: Run KR LPPLCI Tue-Sat at 3AM KST

on:
  schedule:
    # - cron: '0 12 * * 1-5'
    #   timezone: 'Asia/Seoul'
    - cron: '0 01 * * 1-5'
      timezone: 'Asia/Seoul'
  workflow_dispatch:      # 수동 실행도 가능하게 설정

jobs:
  run-lpplci:
    runs-on: ubuntu-latest

    env:
      CLOUDINARY_CLOUD_NAME: ${{ secrets.CLOUDINARY_CLOUD_NAME }}
      CLOUDINARY_API_KEY: ${{ secrets.CLOUDINARY_API_KEY }}
      CLOUDINARY_API_SECRET: ${{ secrets.CLOUDINARY_API_SECRET }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.14.0'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          
      # - name: Check yfinance version
      #   run: |
      #     python -c "import yfinance as yf; print('yfinance version:', yf.__version__)"

      # 이전 실행의 LPPL CI 계산 결과 복원 (없으면 전체 계산)
      - name: Restore LPPL CI cache
        uses: actions/cache/restore@v4
        with:
          path: lppl_cache
          key: lppl-cache-KR-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            lppl-cache-KR-

      - name: Run LPPLCI script
        run: python run_GithubAction.py --market KR

      # 실패해도 그때까지 계산된 종목의 결과는 저장
      - name: Save LPPL CI cache
        if: always() && hashFiles('lppl_cache/**') != ''
        uses: actions/cache/save@v4
        with:
          path: lppl_cache
          key: lppl-cache-KR-${{ github.run_id }}-${{ github.run_attempt }}
